apiVersion: v1
kind: Service
metadata:
  name: rfdetr-inference-service
  labels:
    app: rfdetr-inference
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: rfdetr-inference
