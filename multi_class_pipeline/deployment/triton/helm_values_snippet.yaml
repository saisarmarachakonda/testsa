# Helm values.yaml snippet for IRAS-Location-Tag-Module
# Update this configuration for canary rollout to selected clubs first.

env:
  # Enable RF-DETR backend switcher
  USE_RFDETR_TAGDET: "true"

  # Triton Model Name and Version
  RFDETR_MODEL_NAME: "rfdetr"
  RFDETR_MODEL_VERSION: "2"

  # Triton gRPC Service URL within the AKS cluster (or localhost:8001 via port-forward)
  TRITON_URL: "triton-server.stg-innovation-scrubbervision.svc.cluster.local:8001"

  # Confidence threshold for tag detection
  RFDETR_CONF_THRESHOLD: "0.40"

  # Canary Rollout: Start with a few pilot clubs first
  # Set to empty string "" when ready for 100% full production rollout
  RELEASE_CLUB_LIST: "club_101,club_102,club_105"

# Resource allocations (if applicable)
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"
